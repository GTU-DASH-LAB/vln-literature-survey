<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1356" width="1240" height="1356" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-label="Selection flow: 44 search phrases to 98 papers">
<style>
svg{--bg:#FFFFFF;--ink:#16202A;--mut:#5E6C76;--ln:#C9D3DA;--pl:#F4F7F9;
    --am:#B25E06;--amf:#FCF1E2;--te:#155F80;--tef:#E8F3F8;--wf:#FBEDE8;--wl:#A33A1F;--off:#98A6B0}
@media (prefers-color-scheme:dark){
svg{--bg:#12181E;--ink:#E9EFF3;--mut:#8FA0AC;--ln:#33414C;--pl:#182129;
    --am:#E8973A;--amf:#2A1F12;--te:#5FBEE0;--tef:#12242C;--wf:#2C1A16;--wl:#E38367;--off:#66757F}}
:root[data-theme="dark"] svg{--bg:#12181E;--ink:#E9EFF3;--mut:#8FA0AC;--ln:#33414C;--pl:#182129;
    --am:#E8973A;--amf:#2A1F12;--te:#5FBEE0;--tef:#12242C;--wf:#2C1A16;--wl:#E38367;--off:#66757F}
:root[data-theme="light"] svg{--bg:#FFFFFF;--ink:#16202A;--mut:#5E6C76;--ln:#C9D3DA;--pl:#F4F7F9;
    --am:#B25E06;--amf:#FCF1E2;--te:#155F80;--tef:#E8F3F8;--wf:#FBEDE8;--wl:#A33A1F;--off:#98A6B0}
.t{fill:var(--ink)}.m{fill:var(--mut)}.a{fill:var(--am)}.c{fill:var(--te)}
.bx{fill:var(--pl);stroke:var(--ln);stroke-width:1.5}
.bxa{fill:var(--amf);stroke:var(--am);stroke-width:1.5}
.bxc{fill:var(--tef);stroke:var(--te);stroke-width:1.5}
.bxw{fill:var(--wf);stroke:var(--wl);stroke-width:1.5}
.bxo{fill:none;stroke:var(--off);stroke-width:1.5;stroke-dasharray:5 4}
.ar{stroke:var(--ln);stroke-width:1.75;fill:none;marker-end:url(#h)}
.ln{stroke:var(--ln);stroke-width:1.75;fill:none}
.ara{stroke:var(--am);stroke-width:1.75;fill:none;marker-end:url(#ha);stroke-dasharray:6 4}
.band{fill:var(--mut);font-size:11px;letter-spacing:.10em;font-weight:600}
.n{font-variant-numeric:tabular-nums}
</style>
<defs>
<marker id="h" markerWidth="9" markerHeight="9" refX="7.5" refY="3.4" orient="auto">
<path d="M0,0 L7.5,3.4 L0,6.8 z" fill="var(--ln)"/></marker>
<marker id="ha" markerWidth="9" markerHeight="9" refX="7.5" refY="3.4" orient="auto">
<path d="M0,0 L7.5,3.4 L0,6.8 z" fill="var(--am)"/></marker>
</defs>
<rect width="1240" height="1356" fill="var(--bg)"/>
<text x="40" y="46" font-size="21" class="t" text-anchor="start" font-weight="600">How 44 search phrases become 98 papers</text>
<text x="40" y="68" font-size="12.5" class="m" text-anchor="start" font-weight="400">Harvest 2026-09-06 · window 2023-01-01 onward · every number generated from the corpus, none typed</text>
<text x="40" y="112" font-size="11" class="band" text-anchor="start" font-weight="400">1 · QUERY SETS</text>
<path d="M161.0,108 L1136,108" stroke="var(--ln)" stroke-width="1"/>
<rect x="40" y="128" width="262" height="78" rx="5" class="bxc"/>
<text x="54" y="150" font-size="14" class="c" text-anchor="start" font-weight="700">core</text>
<text x="288" y="150" font-size="11.5" class="m n" text-anchor="end" font-weight="400">11 phrases</text>
<text x="54" y="170" font-size="11.5" class="t" text-anchor="start" font-weight="400">Q1 — the “…navigation” family</text>
<text x="54" y="190" font-size="11" class="m" text-anchor="start" font-weight="400">high precision</text>
<text x="288" y="190" font-size="11.5" class="m n" text-anchor="end" font-weight="400">→ 765 unique</text>
<rect x="318" y="128" width="262" height="78" rx="5" class="bxc"/>
<text x="332" y="150" font-size="14" class="c" text-anchor="start" font-weight="700">recall</text>
<text x="566" y="150" font-size="11.5" class="m n" text-anchor="end" font-weight="400">16 phrases</text>
<text x="332" y="170" font-size="11.5" class="t" text-anchor="start" font-weight="400">Q2/Q4 — what else the field calls it</text>
<text x="332" y="190" font-size="11" class="m" text-anchor="start" font-weight="400">the fix for Q1</text>
<text x="566" y="190" font-size="11.5" class="m n" text-anchor="end" font-weight="400">→ 2 100 unique</text>
<rect x="596" y="128" width="262" height="78" rx="5" class="bxa"/>
<text x="610" y="150" font-size="14" class="a" text-anchor="start" font-weight="700">zeroshot</text>
<text x="844" y="150" font-size="11.5" class="m n" text-anchor="end" font-weight="400">8 phrases</text>
<text x="610" y="170" font-size="11.5" class="t" text-anchor="start" font-weight="400">Q5 — zero-shot / training-free</text>
<text x="610" y="190" font-size="11" class="m" text-anchor="start" font-weight="400">Section IX</text>
<text x="844" y="190" font-size="11.5" class="m n" text-anchor="end" font-weight="400">→ 162 unique</text>
<rect x="874" y="128" width="262" height="78" rx="5" class="bxa"/>
<text x="888" y="150" font-size="14" class="a" text-anchor="start" font-weight="700">enabler</text>
<text x="1122" y="150" font-size="11.5" class="m n" text-anchor="end" font-weight="400">9 phrases</text>
<text x="888" y="170" font-size="11.5" class="t" text-anchor="start" font-weight="400">maps, scene graphs, code-as-policy</text>
<text x="888" y="190" font-size="11" class="m" text-anchor="start" font-weight="400">never says “navigation”</text>
<text x="1122" y="190" font-size="11.5" class="m n" text-anchor="end" font-weight="400">→ 435 unique</text>
<path d="M171,222 L1005,222" class="ln"/>
<path d="M171,212 L171,222" class="ln"/>
<path d="M449,212 L449,222" class="ln"/>
<path d="M727,212 L727,222" class="ln"/>
<path d="M1005,212 L1005,222" class="ln"/>
<path d="M588,222 L588,268" class="ar"/>
<text x="40" y="258" font-size="11" class="band" text-anchor="start" font-weight="400">2 · SOURCES QUERIED</text>
<path d="M198.5,254 L1136,254" stroke="var(--ln)" stroke-width="1"/>
<rect x="40" y="278" width="352" height="50" rx="5" class="bx"/>
<text x="53" y="299" font-size="12.5" class="t" text-anchor="start" font-weight="600">OpenAlex</text>
<text x="379" y="299" font-size="12.5" class="c n" text-anchor="end" font-weight="700">4 617</text>
<text x="53" y="316" font-size="11" class="m" text-anchor="start" font-weight="400">title + abstract phrase search</text>
<rect x="412" y="278" width="352" height="50" rx="5" class="bx"/>
<text x="425" y="299" font-size="12.5" class="t" text-anchor="start" font-weight="600">Semantic Scholar</text>
<text x="751" y="299" font-size="12.5" class="c n" text-anchor="end" font-weight="700">2 704</text>
<text x="425" y="316" font-size="11" class="m" text-anchor="start" font-weight="400">indexes CV/robotics references</text>
<rect x="784" y="278" width="352" height="50" rx="5" class="bx"/>
<text x="797" y="299" font-size="12.5" class="t" text-anchor="start" font-weight="600">arXiv</text>
<text x="1123" y="299" font-size="12.5" class="c n" text-anchor="end" font-weight="700">1 505</text>
<text x="797" y="316" font-size="11" class="m" text-anchor="start" font-weight="400">the preprint stream</text>
<rect x="40" y="340" width="352" height="50" rx="5" class="bx"/>
<text x="53" y="361" font-size="12.5" class="t" text-anchor="start" font-weight="600">OpenReview</text>
<text x="379" y="361" font-size="12.5" class="c n" text-anchor="end" font-weight="700">1 153</text>
<text x="53" y="378" font-size="11" class="m" text-anchor="start" font-weight="400">NeurIPS · ICLR · ICML · CoRL</text>
<rect x="412" y="340" width="352" height="50" rx="5" class="bx"/>
<text x="425" y="361" font-size="12.5" class="t" text-anchor="start" font-weight="600">Crossref</text>
<text x="751" y="361" font-size="12.5" class="c n" text-anchor="end" font-weight="700">685</text>
<text x="425" y="378" font-size="11" class="m" text-anchor="start" font-weight="400">publisher DOI records</text>
<rect x="784" y="340" width="352" height="50" rx="5" class="bx"/>
<text x="797" y="361" font-size="12.5" class="t" text-anchor="start" font-weight="600">DBLP</text>
<text x="1123" y="361" font-size="12.5" class="c n" text-anchor="end" font-weight="700">580</text>
<text x="797" y="378" font-size="11" class="m" text-anchor="start" font-weight="400">canonical CS venues</text>
<rect x="40" y="402" width="538" height="44" rx="5" class="bxo"/>
<text x="53" y="422" font-size="12.5" class="m" text-anchor="start" font-weight="600">IEEE Xplore</text>
<text x="565" y="422" font-size="11" class="m" text-anchor="end" font-weight="400">not harvested</text>
<text x="53" y="438" font-size="11" class="m" text-anchor="start" font-weight="400">no API key set — the script skips it and says so</text>
<rect x="598" y="402" width="538" height="44" rx="5" class="bxo"/>
<text x="611" y="422" font-size="12.5" class="m" text-anchor="start" font-weight="600">Scopus · Web of Science</text>
<text x="1123" y="422" font-size="11" class="m" text-anchor="end" font-weight="400">not harvested</text>
<text x="611" y="438" font-size="11" class="m" text-anchor="start" font-weight="400">institutional session; export and merge instead</text>
<path d="M216,462 L960,462" class="ln"/>
<path d="M216,452 L216,462" class="ln"/>
<path d="M588,452 L588,462" class="ln"/>
<path d="M960,452 L960,462" class="ln"/>
<path d="M588,462 L588,508" class="ar"/>
<text x="40" y="498" font-size="11" class="band" text-anchor="start" font-weight="400">3 · IDENTIFICATION, DEDUPLICATION, SCREENING</text>
<path d="M386.0,494 L1136,494" stroke="var(--ln)" stroke-width="1"/>
<rect x="308" y="518" width="560" height="60" rx="5" class="bx"/>
<text x="328" y="543" font-size="13.5" class="t" text-anchor="start" font-weight="600">Records retrieved</text>
<text x="848" y="545" font-size="19" class="c n" text-anchor="end" font-weight="700">11 244</text>
<text x="328" y="563" font-size="11.5" class="m" text-anchor="start" font-weight="400">one row per record × source — the PRISMA identification count</text>
<path d="M588,578 L588,606" class="ar"/>
<rect x="308" y="606" width="560" height="60" rx="5" class="bx"/>
<text x="328" y="631" font-size="13.5" class="t" text-anchor="start" font-weight="600">Unique records</text>
<text x="848" y="633" font-size="19" class="c n" text-anchor="end" font-weight="700">3 208</text>
<text x="328" y="651" font-size="11.5" class="m" text-anchor="start" font-weight="400">−8 036 duplicates on DOI, arXiv id and normalised title · 2 476 found by ≥ 2 sources</text>
<path d="M588,666 L588,694" class="ar"/>
<rect x="308" y="694" width="560" height="30" rx="5" class="bx"/>
<text x="328" y="714" font-size="12.5" class="t" text-anchor="start" font-weight="600">Title-and-abstract pre-screen against IC1–IC6 / EC1–EC7</text>
<path d="M588,724 L588,742" class="ln"/>
<path d="M171,742 L1005,742" class="ln"/>
<path d="M171,742 L171,762" class="ar"/>
<path d="M449,742 L449,762" class="ar"/>
<path d="M727,742 L727,762" class="ar"/>
<path d="M1005,742 L1005,762" class="ar"/>
<rect x="40" y="762" width="262" height="62" rx="5" class="bxc"/>
<text x="54" y="784" font-size="13" class="c" text-anchor="start" font-weight="700">include</text>
<text x="288" y="784" font-size="15" class="c n" text-anchor="end" font-weight="700">861</text>
<text x="54" y="804" font-size="10.5" class="m" text-anchor="start" font-weight="400">navigation + language + vision all present</text>
<rect x="318" y="762" width="262" height="62" rx="5" class="bxa"/>
<text x="332" y="784" font-size="13" class="a" text-anchor="start" font-weight="700">check</text>
<text x="566" y="784" font-size="15" class="a n" text-anchor="end" font-weight="700">167</text>
<text x="332" y="804" font-size="10.5" class="m" text-anchor="start" font-weight="400">the gate could not call it — read these first</text>
<rect x="596" y="762" width="262" height="62" rx="5" class="bx"/>
<text x="610" y="784" font-size="13" class="t" text-anchor="start" font-weight="700">survey</text>
<text x="844" y="784" font-size="15" class="m n" text-anchor="end" font-weight="700">89</text>
<text x="610" y="804" font-size="10.5" class="m" text-anchor="start" font-weight="400">EC6 — held for Table I, not the method corpus</text>
<rect x="874" y="762" width="262" height="62" rx="5" class="bx"/>
<text x="888" y="784" font-size="13" class="t" text-anchor="start" font-weight="700">exclude</text>
<text x="1122" y="784" font-size="15" class="m n" text-anchor="end" font-weight="700">2 091</text>
<text x="888" y="804" font-size="10.5" class="m" text-anchor="start" font-weight="400">EC1–EC5, each row carrying the code that fired</text>
<text x="40" y="846" font-size="11.5" class="m" text-anchor="start" font-weight="400">A keyword gate cannot judge IC4–IC6. It orders the obvious exclusions and makes the undecidable bucket explicit; the human pass starts at check.</text>
<text x="40" y="888" font-size="11" class="band" text-anchor="start" font-weight="400">4 · FROM 861 INCLUDED TO THE 98 READ</text>
<path d="M326.0,884 L1136,884" stroke="var(--ln)" stroke-width="1"/>
<rect x="40" y="904" width="352" height="78" rx="5" class="bxc"/>
<text x="56" y="926" font-size="13" class="c" text-anchor="start" font-weight="700">Pool</text>
<text x="376" y="928" font-size="19" class="c n" text-anchor="end" font-weight="700">776</text>
<text x="56" y="946" font-size="11.5" class="t" text-anchor="start" font-weight="400">include ∧ 2024–2026</text>
<text x="56" y="966" font-size="11" class="m" text-anchor="start" font-weight="400">pre-2024 work is cited as background, not read</text>
<rect x="412" y="904" width="352" height="78" rx="5" class="bx"/>
<text x="428" y="926" font-size="13" class="t" text-anchor="start" font-weight="600">Rank</text>
<text x="428" y="946" font-size="11.5" class="t" text-anchor="start" font-weight="400">citations ÷ years since publication</text>
<text x="428" y="966" font-size="11" class="m" text-anchor="start" font-weight="400">× 1.25 peer-reviewed · +2 per agreeing source</text>
<rect x="784" y="904" width="352" height="78" rx="5" class="bxa"/>
<text x="800" y="926" font-size="13" class="a" text-anchor="start" font-weight="700">Gate</text>
<text x="800" y="946" font-size="11.5" class="t" text-anchor="start" font-weight="400">seed ∨ peer-reviewed ∨ ≥ 3 citations</text>
<text x="800" y="966" font-size="11" class="m" text-anchor="start" font-weight="400">an unfillable tier is left short, never padded</text>
<path d="M392,943 L408,943" class="ar"/>
<path d="M764,943 L780,943" class="ar"/>
<path d="M216,998 L960,998" class="ln"/>
<path d="M216,988 L216,998" class="ln"/>
<path d="M588,988 L588,998" class="ln"/>
<path d="M960,988 L960,998" class="ln"/>
<path d="M588,998 L588,1022" class="ar"/>
<text x="40" y="1012" font-size="11" class="band" text-anchor="start" font-weight="400">5 · CHAPTER QUOTAS — CEILINGS, NOT TARGETS</text>
<path d="M371.0,1008 L1136,1008" stroke="var(--ln)" stroke-width="1"/>
<rect x="40" y="1032" width="352" height="50" rx="5" class="bxa"/>
<text x="53" y="1053" font-size="12" class="t" text-anchor="start" font-weight="600">T1 zero-shot / training-free</text>
<text x="379" y="1053" font-size="12.5" class="c n" text-anchor="end" font-weight="700">30 / 30</text>
<text x="53" y="1070" font-size="10.5" class="m" text-anchor="start" font-weight="400">Section IX — the survey's own argument</text>
<rect x="412" y="1032" width="352" height="50" rx="5" class="bx"/>
<text x="425" y="1053" font-size="12" class="t" text-anchor="start" font-weight="600">T2 instruction-following VLN</text>
<text x="751" y="1053" font-size="12.5" class="c n" text-anchor="end" font-weight="700">25 / 25</text>
<text x="425" y="1070" font-size="10.5" class="m" text-anchor="start" font-weight="400">the supervised line zero-shot is measured against</text>
<rect x="784" y="1032" width="352" height="50" rx="5" class="bx"/>
<text x="797" y="1053" font-size="12" class="t" text-anchor="start" font-weight="600">T3 end-to-end VLA / video policies</text>
<text x="1123" y="1053" font-size="12.5" class="c n" text-anchor="end" font-weight="700">15 / 15</text>
<text x="797" y="1070" font-size="10.5" class="m" text-anchor="start" font-weight="400">the competing paradigm: one model, no pipeline</text>
<rect x="40" y="1094" width="352" height="50" rx="5" class="bx"/>
<text x="53" y="1115" font-size="12" class="t" text-anchor="start" font-weight="600">T4 benchmarks, datasets, simulators</text>
<text x="379" y="1115" font-size="12.5" class="c n" text-anchor="end" font-weight="700">12 / 12</text>
<text x="53" y="1132" font-size="10.5" class="m" text-anchor="start" font-weight="400">Section V and Tables II–V</text>
<rect x="412" y="1094" width="352" height="50" rx="5" class="bx"/>
<text x="425" y="1115" font-size="12" class="t" text-anchor="start" font-weight="600">T5 real robot / sim-to-real</text>
<text x="751" y="1115" font-size="12.5" class="c n" text-anchor="end" font-weight="700">10 / 10</text>
<text x="425" y="1132" font-size="10.5" class="m" text-anchor="start" font-weight="400">RQ4 — the gap between a leaderboard and a robot</text>
<rect x="784" y="1094" width="352" height="50" rx="5" class="bxw"/>
<text x="797" y="1115" font-size="12" class="t" text-anchor="start" font-weight="600">T6 maps, scene graphs, enablers</text>
<text x="1123" y="1115" font-size="12.5" class="a n" text-anchor="end" font-weight="700">6 / 8</text>
<text x="797" y="1132" font-size="10.5" class="m" text-anchor="start" font-weight="400">never say “navigation”; the methods stand on them</text>
<path d="M216,1156 L960,1156" class="ln"/>
<path d="M216,1146 L216,1156" class="ln"/>
<path d="M588,1146 L588,1156" class="ln"/>
<path d="M960,1146 L960,1156" class="ln"/>
<path d="M588,1156 L588,1182" class="ar"/>
<rect x="308" y="1182" width="560" height="62" rx="5" class="bxc"/>
<text x="328" y="1208" font-size="14" class="t" text-anchor="start" font-weight="600">Papers read</text>
<text x="848" y="1212" font-size="25" class="c n" text-anchor="end" font-weight="700">98</text>
<text x="328" y="1230" font-size="11" class="m" text-anchor="start" font-weight="400">98 not 100 — the maps/scene-graph tier filled 6 of 8 slots and was left short</text>
<rect x="308" y="1268" width="560" height="64" rx="5" class="bxa"/>
<text x="328" y="1290" font-size="12.5" class="a" text-anchor="start" font-weight="700">Recall audit</text>
<text x="848" y="1292" font-size="15" class="a n" text-anchor="end" font-weight="700">26/26</text>
<text x="328" y="1308" font-size="11" class="m" text-anchor="start" font-weight="400">35 landmark works; every seed inside the window is recovered. Q1 alone recovered 8.</text>
<text x="328" y="1324" font-size="11" class="m" text-anchor="start" font-weight="400">Re-run after every query change — this loop is why there are four sets, not one.</text>
<path d="M868,1300 L1196,1300 L1196,106 L1140,106" class="ara"/>
</svg>